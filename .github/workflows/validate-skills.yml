name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "tools/**"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No setup-python step: the runner ships Python 3, and these scripts are stdlib only.
      - run: python3 tools/validate_skill.py
