name: Commit Check

on:
  pull_request:
    branches: 'main'
    # `edited` lets the action re-validate the PR title when it changes.
    types: [opened, synchronize, reopened, edited]

jobs:
  commit-check:
    runs-on: ubuntu-latest
    permissions:  # use permissions because of pr-comments
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for merge-base checks
      - uses: commit-check/commit-check-action@v2
        with:
          message: true
          branch: true
          author-name: false
          author-email: false
          job-summary: true
          pr-comments: true
          pr-title: true
